<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="zsa-version" content="1.0.1">
<meta name="description" content="Practice writing formulas and names for binary ionic compounds with step-by-step hints and feedback.">
<title>Ionic Formula Builder | ZornScience</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../shared/zsa-base.css?v=1.0.1">
<link rel="stylesheet" href="../shared/zsa-activity.css?v=1.0.1">
<link rel="stylesheet" href="builder.css?v=1.0.1">
<script src="../shared/zsa-embed.js?v=1.0.1" defer></script>
<script src="../shared/zsa-engine.js?v=1.0.1" defer></script>
<script src="data.js?v=1.0.1" defer></script>
<script src="builder.js?v=1.0.1" defer></script>
</head>
<body>
<main class="zsa zsa-activity zsa-ifb" data-zsa-activity="ionic-formula-builder">
<header class="zsa-header">
<div class="zsa-topline" data-zsa-chrome>
<a class="zsa-back" href="https://zornscience.org/science/chemistry/unit-3-ionic-bonding/binary-compounds/">← Back to the lesson</a>
<p class="zsa-eyebrow">Chemistry · Ionic Bonding</p>
</div>
<h1>Ionic Formula Builder</h1>
</header>
<noscript><p class="zsa-panel">This activity needs JavaScript. Enable it to practice.</p></noscript>
<div class="zsa-layout">
<section class="zsa-ref" aria-label="Compound and periodic table">
<div class="zsa-ifb-compound" id="zsa-ifb-compound"></div>
<div class="zsa-table-wrap">
<div id="zsa-ifb-table"></div>
<p class="zsa-table-note" id="zsa-ifb-table-note">Main groups only. Transition metals are not shown.</p>
</div>
</section>
<section class="zsa-work" id="zsa-ifb-work" aria-label="Formula practice"></section>
</div>
<p class="zsa-sr-only" id="zsa-ifb-live" aria-live="polite" aria-atomic="true"></p>
<details class="zsa-card zsa-modes" id="zsa-ifb-options">
<summary>Practice options</summary>
<div class="zsa-modes-body">
<p>Start a fresh mixed round or work on one compound. Starting again clears this round.</p>
<button class="zsa-btn" id="zsa-ifb-new" type="button">Start a new round</button>
<div class="zsa-picker">
<label for="zsa-ifb-select">Choose a compound</label>
<select id="zsa-ifb-select"></select>
<label for="zsa-ifb-direction">Direction</label>
<select id="zsa-ifb-direction"></select>
<button class="zsa-btn" id="zsa-ifb-pick" type="button">Practice this compound</button>
</div>
</div>
</details>
<footer class="zsa-footer" data-zsa-chrome><span>ZornScience</span><a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a></footer>
</main>
</body>
