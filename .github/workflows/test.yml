name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One-time setup on the Fedora runner: install Chromium system libraries with dnf.
# The workflow downloads only the browser; it does not install OS packages or require sudo.

jobs:
  test:
    name: Unit and browser tests
    runs-on: [self-hosted, linux]
    # Allow time for the full browser suite with one worker. Queue time does not count toward this timeout.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Clear leftover output from previous runs
        run: rm -rf test-results playwright-report
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:unit
      - run: npx playwright test --workers=1
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  parity:
    name: Behavior parity with the base branch
    # Compares the pull request with its base branch in the browser. Add the label "behavior-change" to a pull
    # request that changes behavior on purpose to skip it.
    # Note: with a single self-hosted runner, this job waits for the test job to finish.
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'behavior-change')
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Clear leftover output from previous runs
        run: rm -rf parity-report
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run parity -- --base origin/${{ github.base_ref }} --out parity-report
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: parity-report
          path: parity-report/
          retention-days: 7
